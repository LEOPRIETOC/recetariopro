<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gorrito de chef (toque) en azul corporativo -->
  <g fill="#0833A2">
    <!-- Banda inferior -->
    <rect x="14" y="34" width="36" height="22" rx="3"/>
    <!-- Tres lobulos esponjosos del top -->
    <ellipse cx="20" cy="22" rx="11" ry="12"/>
    <ellipse cx="44" cy="22" rx="11" ry="12"/>
    <ellipse cx="32" cy="16" rx="12" ry="13"/>
    <!-- Cuello (rellenar el espacio entre los lobulos y la banda) -->
    <path d="M14 30 L50 30 L50 38 L14 38 Z"/>
  </g>
  <!-- Pliegues sutiles en la banda -->
  <g stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.45">
    <line x1="22" y1="40" x2="22" y2="52"/>
    <line x1="32" y1="40" x2="32" y2="52"/>
    <line x1="42" y1="40" x2="42" y2="52"/>
  </g>
</svg>
