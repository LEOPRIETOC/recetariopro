<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0833A2" />
    <meta name="description" content="RecetarioPro — Gestión profesional de recetas para restaurantes" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RecetarioPro</title>
    <script>
      // ── Service worker kill-switch ────────────────────────────────────────────
      // El control de version (deteccion + modal bloqueante) lo maneja React via
      // src/components/shared/UpdateBar.jsx. Aqui solo nos aseguramos de que no
      // queden service workers viejos sirviendo HTML cacheado.
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
