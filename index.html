<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0833A2" />
    <meta name="description" content="RecetarioPro — Gestión profesional de recetas para restaurantes" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RecetarioPro</title>
    <script>
      // ── Version gate ─────────────────────────────────────────────────────────
      // Corre ANTES de que React monte. Compara el buildId del version.json con
      // el guardado en localStorage. Si la version cargada es obsoleta, limpia
      // caches + service workers y recarga con cache-bust.
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          }
        } catch (e) {}

        if (!('fetch' in window) || !('localStorage' in window)) return;
        var KEY = 'app_buildId';
        var prev = null;
        try { prev = localStorage.getItem(KEY); } catch (e) {}

        fetch('/version.json?ts=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r && r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data || !data.buildId) return;
            if (prev && prev !== data.buildId) {
              var p = Promise.resolve();
              try {
                if ('caches' in window) {
                  p = caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  });
                }
              } catch (e) {}
              p.catch(function () {}).then(function () {
                try { localStorage.setItem(KEY, data.buildId); } catch (e) {}
                var u = new URL(window.location.href);
                u.searchParams.set('v', data.buildId);
                window.location.replace(u.toString());
              });
            } else {
              try { localStorage.setItem(KEY, data.buildId); } catch (e) {}
            }
          })
          .catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
